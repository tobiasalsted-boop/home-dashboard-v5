<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hjem">
<title>Hjem</title>
<style>
/* Aftenblå baggrund, lampelys-gul for "nu" */
:root {
  --bg: #1c2633; --panel: #243143; --line: #33445a;
  --text: #e9eef4; --muted: #8fa0b3; --lit: #f4c46a;
  --fixed: #3a4d66; --cheap: #7cc4b0; --mid: #9fb3cc; --dear: #ec8a6e; --band: rgba(244,196,106,.08); --chip: #33445a; --err: #ff8a7a;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #e4eaf0; --panel: #ffffff; --line: #dde3ea;
    --text: #1c2633; --muted: #5d6b7b; --lit: #d9962a;
    --fixed: #cdd7e2; --cheap: #2f9a80; --mid: #7f95b0; --dear: #d4583b; --band: rgba(217,150,42,.10); --chip: #e4eaf0; --err: #b3261e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

.app { min-height: 100%; display: grid; gap: 16px; padding: 22px 28px 26px;
  grid-template-columns: 1fr 1.3fr; grid-template-rows: auto minmax(400px, auto) auto auto auto; }
header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; }
#clock { font-size: 96px; font-weight: 200; line-height: .9; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
#date { font-size: 21px; color: var(--muted); margin-top: 10px; }
.now { display: flex; align-items: center; gap: 16px; text-align: right; }
.now .icon { font-size: 60px; line-height: 1; }
.now .temp { font-size: 60px; font-weight: 200; line-height: 1; }
.now .desc { color: var(--muted); font-size: 17px; margin-top: 4px; }

.panel { background: var(--panel); border-radius: 24px; padding: 18px 22px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.panel h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.panel h2 small { font-size: 13px; font-weight: 400; color: var(--muted); }
.panel h2 small.err { color: var(--err); }

#cal { grid-column: 1; grid-row: 2 / 4; }
#price { grid-column: 2; grid-row: 2; }
#week { grid-column: 2; grid-row: 3; }
#school { grid-column: 1 / -1; grid-row: 4; }
#sfo { grid-column: 1 / -1; grid-row: 5; }
#calList { contain: size; min-height: 0; }

/* Kalender */
#calList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.day { margin-bottom: 16px; }
.day h3 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
.day.today h3 { color: var(--lit); }
.ev { display: flex; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 18px; }
.day h3 + .ev, .day h3 + .ev time { flex: 0 0 84px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 16px; padding-top: 1px; }
.ev .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.past { opacity: .4; }
.empty { color: var(--muted); font-size: 16px; padding: 6px 0; }
.connect { margin-top: 8px; font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 12px; border: 0; background: var(--lit); color: #3a2600; }

/* Elpris */
.pricehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 8px; }
.stats { display: flex; gap: 28px; }
.stat .v { font-size: 32px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v span { font-size: 15px; color: var(--muted); margin-left: 4px; }
.stat .l { font-size: 14px; color: var(--muted); }
.stat.current .v { color: var(--lit); }
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; flex-shrink: 0; }
.seg:empty { display: none; }
.seg button { font: inherit; font-size: 15px; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 9px; }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; }
#chart { flex: 1; min-height: 160px; position: relative; }
#chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
#chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
#chart .zero { stroke: var(--muted); stroke-width: 1; opacity: .6; }
#chart .ylab, #chart .xlab { fill: var(--muted); font-size: 12px; font-family: inherit; font-variant-numeric: tabular-nums; }
#chart .xlab { text-anchor: middle; }
#chart .band { fill: var(--band); }
#chart .fixed { fill: var(--fixed); }
#chart .lvl-cheap { fill: var(--cheap); }
#chart .lvl-mid { fill: var(--mid); }
#chart .lvl-dear { fill: var(--dear); }
#chart .hr.past { opacity: .35; }
#chart .nowbox { fill: none; stroke: var(--lit); stroke-width: 2; }
#chart .nowlab, #chart .sellab { font-size: 13px; font-weight: 600; text-anchor: middle; font-family: inherit; }
#chart .nowlab { fill: var(--lit); }
#chart .sellab { fill: var(--text); }
#chart .selbox { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 3 3; }
#chart .win { stroke: var(--cheap); stroke-width: 4; stroke-linecap: round; }
#chart .hit { fill: transparent; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .sw.lvl-cheap { background: var(--cheap); }
.legend .sw.lvl-mid { background: var(--mid); }
.legend .sw.lvl-dear { background: var(--dear); }
.legend .sw.fixed { background: var(--fixed); }
.legend .sw.band { background: var(--band); outline: 1px solid var(--line); }
.legend .sw.win { height: 4px; width: 16px; border-radius: 2px; background: var(--cheap); vertical-align: 2px; }
.note { font-size: 14px; color: var(--muted); margin-top: 8px; min-height: 20px; }
.note b { color: var(--cheap); font-weight: 600; }
.note b.sel { color: var(--text); }

/* Skema */
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; flex-shrink: 0; }
#school h2 .seg { font-weight: 400; }
.kids { display: grid; gap: 28px; }
.kid { min-width: 0; }
.kidhead { display: flex; align-items: baseline; font-size: 19px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.kidhead .dot { align-self: center; }
.kidhead .span { margin-left: auto; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.lesson, .extra { display: flex; gap: 14px; padding: 5px 0; font-size: 17px; }
.lesson time, .extra time { flex: 0 0 52px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.lesson .t, .extra .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson.past { opacity: .4; }
.lesson.cancelled .t { text-decoration: line-through; color: var(--dear); }
.lesson.changed .t { color: var(--dear); }
.extra { color: var(--lit); border-top: 1px dashed var(--line); margin-top: 4px; }
.extra time { color: var(--lit); }

/* SFO */
.sfoweek { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.sfoday { border-radius: 16px; padding: 12px 12px 6px; min-width: 0; }
.sfoday.today { background: var(--chip); }
.sfoday h3 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.sfoday.today h3 { color: var(--lit); }
.act { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.act .ico { font-size: 22px; line-height: 1.1; width: 26px; text-align: center; flex-shrink: 0; }
.act .n { font-size: 15px; line-height: 1.25; }
.act .tm { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }

/* Uge */
.weekgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.wd .n { font-size: 15px; color: var(--muted); }
.wd.today .n { color: var(--lit); font-weight: 600; }
.wd .i { font-size: 30px; margin: 6px 0 4px; }
.wd .hi { font-size: 19px; font-variant-numeric: tabular-nums; }
.wd .lo { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wd .rain { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 2px; }

@media (orientation: portrait) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto; }
  #price { grid-column: 1; grid-row: 2; }
  #week { grid-column: 1; grid-row: 3; }
  #cal { grid-column: 1; grid-row: 4; height: 420px; }
  #school { grid-row: 5; }
  #sfo { grid-row: 6; }
  #chart { min-height: 200px; }
}

/* Opsætning */
#setup { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
#setup.show { display: flex; }
#setup .box { max-width: 480px; width: 100%; }
#setup h1 { font-weight: 500; font-size: 26px; margin: 0 0 8px; }
#setup p { color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
#setup input { width: 100%; font: inherit; font-size: 16px; padding: 14px; border-radius: 14px; border: 1px solid var(--muted);
  background: var(--panel); color: var(--text); margin-bottom: 12px; -webkit-user-select: text; user-select: text; }
#setup .row { display: flex; gap: 10px; }
#setup button { font: inherit; font-size: 17px; font-weight: 500; padding: 13px 20px; border-radius: 14px; border: 0; }
#setupSave { background: var(--lit); color: #3a2600; }
#setupSkip { background: transparent; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="now" id="now"></div>
  </header>

  <section class="panel" id="cal">
    <h2>Kalender <small id="calStatus"></small></h2>
    <div id="calList"></div>
  </section>

  <section class="panel" id="price">
    <h2><span id="priceTitle">Elpris</span> <small id="priceStatus"></small></h2>
    <div class="pricehead">
      <div class="stats" id="priceStats"></div>
      <div class="seg" id="priceDays"></div>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
    <div class="note" id="priceNote"></div>
  </section>

  <section class="panel" id="week">
    <h2><span id="weekTitle">Vejret</span> <small id="weatherStatus"></small></h2>
    <div class="weekgrid" id="weekGrid"></div>
  </section>

  <section class="panel" id="school">
    <h2>Skema <div class="seg" id="schoolDays"></div></h2>
    <div class="kids" id="kids"></div>
  </section>

  <section class="panel" id="sfo">
    <h2>SFO-aktiviteter <small id="sfoNote"></small></h2>
    <div class="sfoweek" id="sfoWeek"></div>
  </section>
</div>

<div id="setup">
  <div class="box">
    <h1>Forbind kalenderen</h1>
    <p>Indsæt adressen til dit Google Apps Script, inklusive <b>?key=</b> og din hemmelige nøgle. Den gemmes kun på denne iPad.</p>
    <input id="setupInput" type="url" placeholder="https://script.google.com/macros/s/…/exec?key=…" autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="row">
      <button id="setupSave" type="button">Forbind</button>
      <button id="setupSkip" type="button">Spring over</button>
    </div>
  </div>
</div>

<script>
// ================= Tilpas her =================
const CONFIG = {
  place: { name: "Hinnerup", lat: 56.267, lon: 10.067 },
  priceArea: "DK1", // Vest for Storebælt

  // Alle beløb i kr. pr. kWh INKL. moms, som de står hos selskaberne.
  // Spotprisen får automatisk lagt moms på. Satser for 2026 – tjek igen i januar.
  prices: {
    leverandoerTillaeg: 0.10, // AURA FlexEl
    elafgift: 0.01,           // Statens elafgift (0,8 øre + moms)
    energinet: 0.1438,        // Energinets net- og systemtarif
    // Dinels nettarif C for private. Vinter = oktober–marts, sommer = april–september.
    net: {
      vinter: { lav: 0.0769, hoej: 0.2308, spids: 0.6924 },
      sommer: { lav: 0.0769, hoej: 0.1154, spids: 0.3000 }
    },
    // Hvilken netperiode hver time (kl. 0–23) hører til hos Dinel.
    netPerioder: [
      "lav","lav","lav","lav","lav","lav",                     // 00–06
      "hoej","hoej","hoej","hoej","hoej","hoej",               // 06–12
      "hoej","hoej","hoej","hoej","hoej",                      // 12–17
      "spids","spids","spids","spids",                         // 17–21
      "hoej","hoej","hoej"                                     // 21–24
    ],
    billigVindue: 3 // Antal timer i "billigste stræk"
  },

  // SFO-aktiviteter pr. ugedag (1 = mandag … 5 = fredag).
  // Opdatér listen, når en ny periode starter. Efter "opdaterSenest" viser feltet en påmindelse.
  sfo: {
    periode: "Efterår 2026",
    opdaterSenest: "2027-02-15",
    dage: {
      1: [
        { tid: "13:00–15:00", navn: "Floorball i Gl. Gym", ikon: "🏑" },
        { tid: "13:00–15:30", navn: "Spil på broen for 0. årgang", ikon: "🎲" },
        { tid: "13:00–15:00", navn: "SFO-kor i 1.D", ikon: "🎵" },
        { tid: "13:00–15:30", navn: "Krea på værkstedet", ikon: "🎨" }
      ],
      2: [
        { tid: "14:00–15:45", navn: "Fantasidyr på krea", ikon: "🦄" },
        { tid: "14:00–15:00", navn: "Hal og gymnastiksal", ikon: "🤸" },
        { tid: "14:00–15:30", navn: "Mindfulness 0.C", ikon: "🧘" }
      ],
      3: [
        { tid: "13:00–15:00", navn: "Bål", ikon: "🔥" },
        { tid: "13:00–15:00", navn: "Gammel Gymnastiksal", ikon: "🤸" },
        { tid: "13:00–15:00", navn: "Snitte på legepladsen", ikon: "🪵" },
        { tid: "13:00–15:30", navn: "Krea på værkstedet", ikon: "🎨" }
      ],
      4: [
        { tid: "14:00–15:00", navn: "Mooncar/løbehjulræs v. 0.kl.", ikon: "🛴" },
        { tid: "14:00–15:30", navn: "Lego i 0.C", ikon: "🧱" },
        { tid: "14:00–15:30", navn: "Skak på broen", ikon: "♟️" },
        { tid: "14:00–15:30", navn: "Perler og Historie Broen", ikon: "📿" },
        { tid: "14:00–15:30", navn: "Rock og korssting på værkstedet", ikon: "🧵" }
      ],
      5: [
        { tid: "12:00–14:00", navn: "Gymnastiksal", ikon: "🤸" },
        { tid: "12:00–14:00", navn: "Krea", ikon: "🎨" },
        { tid: "12:00–14:00", navn: "Stor Kamp", ikon: "🏃" },
        { tid: "12:00–15:30", navn: "Skak på broen", ikon: "♟️" }
      ]
    }
  },

  calendarDays: 7,
  refreshMinutes: { weather: 30, prices: 15, calendar: 10 }
};
// ==============================================

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const DAYS = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
const DAYS_SHORT = ["Søn", "Man", "Tir", "Ons", "Tor", "Fre", "Lør"];
const MONTHS = ["januar", "februar", "marts", "april", "maj", "juni", "juli", "august", "september", "oktober", "november", "december"];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const isoDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const kr = v => v.toFixed(2).replace(".", ",");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function setStatus(id, text, isErr) { const s = $(id); s.textContent = text; s.className = isErr ? "err" : ""; }

async function run(statusId, fn) {
  try {
    await fn();
    setStatus(statusId, "Opdateret " + hhmm(new Date()));
  } catch (e) {
    console.error(e);
    setStatus(statusId, e.userMessage || "Kunne ikke hente. Prøver igen snart", true);
  }
}

// ---------- Ur ----------
function tick() {
  const d = new Date();
  $("clock").textContent = hhmm(d);
  $("date").textContent = cap(DAYS[d.getDay()]) + " " + d.getDate() + ". " + MONTHS[d.getMonth()];
}

// ---------- Vejr (Open-Meteo) ----------
const WMO = {
  0: ["☀️", "Klart"], 1: ["🌤️", "Mest klart"], 2: ["⛅", "Delvist skyet"], 3: ["☁️", "Overskyet"],
  45: ["🌫️", "Tåge"], 48: ["🌫️", "Rimtåge"],
  51: ["🌦️", "Let støvregn"], 53: ["🌦️", "Støvregn"], 55: ["🌧️", "Kraftig støvregn"],
  56: ["🌧️", "Isslag"], 57: ["🌧️", "Isslag"],
  61: ["🌦️", "Let regn"], 63: ["🌧️", "Regn"], 65: ["🌧️", "Kraftig regn"], 66: ["🌧️", "Isslag"], 67: ["🌧️", "Isslag"],
  71: ["🌨️", "Let sne"], 73: ["🌨️", "Sne"], 75: ["❄️", "Kraftig sne"], 77: ["🌨️", "Snefnug"],
  80: ["🌦️", "Byger"], 81: ["🌧️", "Regnbyger"], 82: ["🌧️", "Kraftige byger"],
  85: ["🌨️", "Snebyger"], 86: ["🌨️", "Kraftige snebyger"],
  95: ["⛈️", "Torden"], 96: ["⛈️", "Torden og hagl"], 99: ["⛈️", "Torden og hagl"]
};
const wmo = c => WMO[c] || ["🌡️", ""];

async function loadWeather() {
  const p = CONFIG.place;
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
    "&current=temperature_2m,weather_code,wind_speed_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum" +
    "&timezone=Europe%2FCopenhagen&forecast_days=7&wind_speed_unit=ms";
  const r = await fetch(url);
  if (!r.ok) throw new Error("Vejr: HTTP " + r.status);
  const j = await r.json();

  const c = j.current, [icon, desc] = wmo(c.weather_code);
  const now = $("now"); now.innerHTML = "";
  const txt = el("div");
  txt.appendChild(el("div", "temp", Math.round(c.temperature_2m) + "°"));
  txt.appendChild(el("div", "desc", desc + ", vind " + Math.round(c.wind_speed_10m) + " m/s"));
  now.appendChild(el("div", "icon", icon));
  now.appendChild(txt);

  $("weekTitle").textContent = "Vejret i " + p.name;
  const g = $("weekGrid"); g.innerHTML = "";
  const d = j.daily;
  for (let i = 0; i < d.time.length; i++) {
    const day = new Date(d.time[i] + "T12:00");
    const box = el("div", "wd" + (i === 0 ? " today" : ""));
    box.appendChild(el("div", "n", i === 0 ? "I dag" : DAYS_SHORT[day.getDay()]));
    box.appendChild(el("div", "i", wmo(d.weather_code[i])[0]));
    box.appendChild(el("div", "hi", Math.round(d.temperature_2m_max[i]) + "°"));
    box.appendChild(el("div", "lo", Math.round(d.temperature_2m_min[i]) + "°"));
    const mm = d.precipitation_sum[i];
    box.appendChild(el("div", "rain", mm >= 0.5 ? String(Math.round(mm * 10) / 10).replace(".", ",") + " mm" : ""));
    g.appendChild(box);
  }
}

// ---------- Elpris ----------
function season(d) {
  const m = d.getMonth(); // 0 = januar
  return (m >= 3 && m <= 8) ? "sommer" : "vinter";
}
// Deler prisen op i strøm (spot inkl. moms) og det faste: tillæg, afgifter og transport
function priceParts(h, spot, date) {
  const P = CONFIG.prices;
  const net = (P.net[season(date)] || {})[P.netPerioder[h]] || 0;
  const fixed = P.leverandoerTillaeg + P.elafgift + P.energinet + net;
  const spotM = spot * 1.25;
  return { h, spotM, fixed, total: spotM + fixed };
}
function hasTariffs() {
  const P = CONFIG.prices, n = P.net[season(new Date())] || {};
  return P.leverandoerTillaeg || P.elafgift || P.energinet || n.lav || n.hoej || n.spids;
}

// Kilde 1: Energinets Energi Data Service. Returnerer { "YYYY-MM-DD": [{h, kr}] } med spot i kr/kWh ekskl. moms.
async function spotFromEnerginet(today) {
  const filter = encodeURIComponent(JSON.stringify({ PriceArea: [CONFIG.priceArea] }));
  const url = "https://api.energidataservice.dk/dataset/DayAheadPrices" +
    "?start=" + isoDate(addDays(today, -1)) + "T00:00&end=" + isoDate(addDays(today, 2)) + "T00:00" +
    "&filter=" + filter + "&limit=1000";
  const r = await fetch(url);
  if (!r.ok) throw new Error("Energinet svarede " + r.status);
  const j = await r.json();
  const keys = [isoDate(today), isoDate(addDays(today, 1))], out = {};
  for (const rec of j.records || []) {
    const k = (rec.TimeDK || "").slice(0, 10);
    if (keys.indexOf(k) < 0) continue;
    let dkk = rec.DayAheadPriceDKK;
    if (dkk == null && rec.DayAheadPriceEUR != null) dkk = rec.DayAheadPriceEUR * 7.46;
    if (dkk != null) (out[k] = out[k] || []).push({ h: +rec.TimeDK.slice(11, 13), kr: dkk / 1000 });
  }
  if (!out[keys[0]]) throw new Error("Energinet havde ingen priser for i dag");
  return out;
}

// Kilde 2 (reserve): elprisenligenu.dk, som viser de samme Nord Pool-priser.
async function spotFromElprisen(today) {
  const get = async d => {
    const url = "https://www.elprisenligenu.dk/api/v1/prices/" + d.getFullYear() + "/" +
      pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "_" + CONFIG.priceArea + ".json";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Elprisen lige nu svarede " + r.status);
    return (await r.json()).map(p => ({ h: +p.time_start.slice(11, 13), kr: p.DKK_per_kWh }));
  };
  const out = {};
  out[isoDate(today)] = await get(today);
  try { out[isoDate(addDays(today, 1))] = await get(addDays(today, 1)); } catch (e) { /* morgendagens priser kommer ved 13-tiden */ }
  return out;
}

// Kvarterpriser samles til timepriser (gennemsnit)
function buildRows(list, date) {
  if (!list || !list.length) return null;
  const buckets = Array.from({ length: 24 }, () => []);
  for (const p of list) if (p.h >= 0 && p.h < 24) buckets[p.h].push(p.kr);
  return buckets.map((a, h) => a.length ? priceParts(h, a.reduce((x, y) => x + y, 0) / a.length, date) : null);
}

let priceDays = [], selDay = 0, pinnedHour = null, pinTimer = null;

async function loadPrices() {
  const today = new Date(), tomorrow = addDays(today, 1);
  let map, fejl = [];
  for (const kilde of [spotFromEnerginet, spotFromElprisen]) {
    try { map = await kilde(today); break; }
    catch (e) { fejl.push(e.message); }
  }
  if (!map) {
    const e = new Error(fejl.join(" / "));
    e.userMessage = "Fejl: " + fejl.join(" / ");
    throw e;
  }
  priceDays = [
    { label: "I dag", rows: buildRows(map[isoDate(today)], today) },
    { label: "I morgen", rows: buildRows(map[isoDate(tomorrow)], tomorrow) }
  ];
  if (!priceDays[selDay].rows) selDay = 0;
  renderPrices();
}

// "Pæne" trin til y-aksen: 0,10 / 0,25 / 0,50 / 1 / 2 kr osv.
function niceStep(raw) {
  const steps = [0.05, 0.1, 0.25, 0.5, 1, 2, 2.5, 5, 10];
  return steps.find(s => s >= raw) || 10;
}
function fmtAxis(v, step) {
  if (Math.abs(v) < 1e-9) return "0 kr";
  return (step >= 1 ? String(Math.round(v)) : v.toFixed(2).replace(".", ",")) + " kr";
}

function renderPrices() {
  const day = priceDays[selDay];
  if (!day) return;
  const rows = day.rows || [];
  const isToday = selDay === 0;
  const nowH = isToday ? new Date().getHours() : -1;
  const n = CONFIG.prices.billigVindue;

  $("priceTitle").textContent = hasTariffs() ? "Elpris" : "Spotpris inkl. moms";

  // Vælger: I dag / I morgen
  const seg = $("priceDays"); seg.innerHTML = "";
  if (priceDays[1] && priceDays[1].rows) {
    priceDays.forEach((d, i) => {
      const b = el("button", i === selDay ? "on" : "", d.label); b.type = "button";
      b.onclick = e => { e.stopPropagation(); selDay = i; pinnedHour = null; renderPrices(); };
      seg.appendChild(b);
    });
  }

  const valid = rows.filter(Boolean);
  const stats = $("priceStats"), note = $("priceNote");
  stats.innerHTML = ""; note.innerHTML = "";
  if (!valid.length) { $("chart").innerHTML = ""; note.textContent = "Dagens priser er ikke offentliggjort endnu."; return; }

  const min = valid.reduce((a, b) => b.total < a.total ? b : a);
  const max = valid.reduce((a, b) => b.total > a.total ? b : a);
  const avg = valid.reduce((s, r) => s + r.total, 0) / valid.length;

  const stat = (label, value, cls) => {
    const s = el("div", "stat" + (cls ? " " + cls : "")), v = el("div", "v", kr(value));
    v.appendChild(el("span", null, "kr"));
    s.appendChild(v); s.appendChild(el("div", "l", label)); stats.appendChild(s);
  };
  if (isToday && rows[nowH]) stat("Lige nu", rows[nowH].total, "current");
  else stat("Gennemsnit", avg);
  stat("Billigst kl. " + pad(min.h), min.total, "cheap");
  stat("Dyrest kl. " + pad(max.h), max.total, "dear");

  // Billigste sammenhængende stræk (resten af dagen, hvis det er i dag)
  let best = null;
  for (let s = Math.max(0, nowH); s + n <= 24; s++) {
    const slice = rows.slice(s, s + n);
    if (slice.some(r => !r)) continue;
    const sum = slice.reduce((a, r) => a + r.total, 0);
    if (!best || sum < best.sum) best = { s, sum };
  }

  drawLegend(best, n);

  // Tekst under grafen: valgt time, ellers billigste stræk
  if (pinnedHour != null && rows[pinnedHour]) {
    const r = rows[pinnedHour];
    note.appendChild(el("b", "sel", "Kl. " + pad(r.h) + "–" + pad((r.h + 1) % 24 || 24) + ": " + kr(r.total) + " kr/kWh"));
    if (hasTariffs()) note.appendChild(document.createTextNode(", heraf strøm " + kr(r.spotM) + " kr og transport og afgifter " + kr(r.fixed) + " kr"));
  } else if (best) {
    note.appendChild(document.createTextNode("Billigste " + n + " timer " + (isToday ? "resten af dagen" : "i morgen") + ": "));
    note.appendChild(el("b", null, "kl. " + pad(best.s) + "–" + pad(best.s + n)));
    note.appendChild(document.createTextNode(", gns. " + kr(best.sum / n) + " kr/kWh. Tryk på en søjle for detaljer."));
  }

  drawChart(rows, nowH, best, n, min.total, max.total);
}

function drawChart(rows, nowH, best, n, minT, maxT) {
  const box = $("chart"); box.innerHTML = "";
  const W = box.clientWidth || 600, H = box.clientHeight || 200;
  const padL = 2, padR = 54, padT = 24, padB = 26;
  const pw = W - padL - padR, ph = H - padT - padB;
  const lo = Math.min(0, minT);
  const step = niceStep((maxT - lo) / 4);
  const top = Math.ceil(maxT / step) * step || step;
  const bot = Math.floor(lo / step) * step;
  const y = v => padT + ph * (top - v) / (top - bot);
  const bw = pw / 24;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const add = (parent, tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e); return e;
  };

  // Spidslast som svag baggrund, så det er tydeligt, hvorfor aftenen er dyr
  const per = CONFIG.prices.netPerioder;
  const s0 = per.indexOf("spids"), s1 = per.lastIndexOf("spids");
  if (s0 >= 0) add(svg, "rect", { x: padL + s0 * bw, y: padT, width: (s1 - s0 + 1) * bw, height: ph, class: "band" });

  // Vandrette hjælpelinjer med kronebeløb til højre
  for (let v = bot; v <= top + 1e-9; v += step) {
    const yy = y(v);
    add(svg, "line", { x1: padL, x2: padL + pw, y1: yy, y2: yy, class: Math.abs(v) < 1e-9 ? "zero" : "grid" });
    add(svg, "text", { x: padL + pw + 8, y: yy + 4, class: "ylab" }, fmtAxis(v, step));
  }

  const level = t => {
    const rel = (t - minT) / ((maxT - minT) || 1);
    return rel < 0.34 ? "cheap" : rel > 0.66 ? "dear" : "mid";
  };

  rows.forEach((r, h) => {
    if (!r) return;
    const x = padL + h * bw + 1.5, w = Math.max(2, bw - 3);
    const g = add(svg, "g", { class: "hr" + (h < nowH ? " past" : "") });
    const base = Math.max(0, Math.min(r.fixed, r.total));
    if (base > 0) add(g, "rect", { x, y: y(base), width: w, height: y(0) - y(base), class: "fixed" });
    if (r.total > base) add(g, "rect", { x, y: y(r.total), width: w, height: y(base) - y(r.total), rx: 2, class: "lvl-" + level(r.total) });
    if (r.total < 0) add(g, "rect", { x, y: y(0), width: w, height: y(r.total) - y(0), class: "lvl-cheap" });

    const yTop = y(Math.max(r.total, 0)), yBot = y(Math.min(r.total, 0));
    if (h === nowH) {
      add(svg, "rect", { x: x - 1.5, y: yTop - 1.5, width: w + 3, height: yBot - yTop + 3, rx: 3, class: "nowbox" });
      add(svg, "text", { x: x + w / 2, y: yTop - 8, class: "nowlab" }, kr(r.total));
    }
    if (h === pinnedHour) {
      add(svg, "rect", { x: x - 1.5, y: yTop - 1.5, width: w + 3, height: yBot - yTop + 3, rx: 3, class: "selbox" });
      if (h !== nowH) add(svg, "text", { x: x + w / 2, y: yTop - 8, class: "sellab" }, kr(r.total));
    }

    // Usynligt trykfelt i fuld højde, så søjlen er nem at ramme
    const hit = add(svg, "rect", { x: padL + h * bw, y: padT, width: bw, height: ph, class: "hit" });
    hit.addEventListener("click", e => {
      e.stopPropagation();
      pinnedHour = pinnedHour === h ? null : h;
      clearTimeout(pinTimer);
      pinTimer = setTimeout(() => { pinnedHour = null; renderPrices(); }, 10000);
      renderPrices();
    });
  });

  // Billigste stræk som grøn streg under søjlerne
  if (best) {
    const yy = y(bot) + 5;
    add(svg, "line", { x1: padL + best.s * bw + 2, x2: padL + (best.s + n) * bw - 2, y1: yy, y2: yy, class: "win" });
  }

  // Klokkeslæt hver 3. time
  for (let h = 0; h < 24; h += 3) {
    add(svg, "text", { x: padL + h * bw + bw / 2, y: H - 4, class: "xlab" }, pad(h));
  }

  box.appendChild(svg);
}

function drawLegend(best, n) {
  const lg = $("legend"); lg.innerHTML = "";
  const item = (cls, text) => {
    const s = el("span", "li"); s.appendChild(el("i", "sw " + cls)); s.appendChild(document.createTextNode(text)); lg.appendChild(s);
  };
  item("lvl-cheap", "Billig");
  item("lvl-mid", "Mellem");
  item("lvl-dear", "Dyr");
  if (hasTariffs()) item("fixed", "Transport og afgifter");
  item("band", "Spidslast");
  if (best) item("win", "Billigste " + n + " timer");
}

// ---------- Kalender (Google Apps Script) ----------
let memCalUrl = null;
function getCalUrl() { try { return localStorage.getItem("cal_url") || memCalUrl; } catch (e) { return memCalUrl; } }
function setCalUrl(u) { memCalUrl = u; try { u ? localStorage.setItem("cal_url", u) : localStorage.removeItem("cal_url"); } catch (e) {} }

function showSetup() { $("setupInput").value = ""; $("setup").className = "show"; }
function hideSetup() { $("setup").className = ""; }

function renderCalNotConnected() {
  const list = $("calList"); list.innerHTML = "";
  list.appendChild(el("div", "empty", "Kalenderen er ikke forbundet."));
  const b = el("button", "connect", "Forbind kalender"); b.type = "button"; b.onclick = showSetup;
  list.appendChild(b);
  setStatus("calStatus", "");
  renderSchool();
}

async function loadCalendar() {
  const base = getCalUrl();
  if (!base) { renderCalNotConnected(); return; }
  const url = base + (base.indexOf("?") >= 0 ? "&" : "?") + "days=" + CONFIG.calendarDays;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Kalender: HTTP " + r.status);
  const j = await r.json();
  if (j.error) {
    const e = new Error(j.error);
    e.userMessage = j.error === "unauthorized" ? "Nøglen blev afvist. Tryk for at forbinde igen" : "Kalenderfejl: " + j.error;
    throw e;
  }
  renderCalendar(j.events || []);
}

// Farver pr. barn (i alfabetisk rækkefølge)
const CHILD_COLORS = ["#8fb4f0", "#e79cc2", "#b7d77a", "#f0b97a"];
const childColor = {};
function colorFor(who) {
  if (!(who in childColor)) childColor[who] = CHILD_COLORS[Object.keys(childColor).length % CHILD_COLORS.length];
  return childColor[who];
}
const dot = who => { const d = el("i", "dot"); d.style.background = colorFor(who); return d; };
const dayLabel = (ds, i) => i === 0 ? "I dag" : i === 1 ? "I morgen" : cap(DAYS[ds.getDay()]) + " " + ds.getDate() + ". " + MONTHS[ds.getMonth()];

let lastEvents = [];

function parseEvents() {
  return lastEvents.map(e => ({
    title: e.title, allDay: e.allDay, start: new Date(e.start), end: new Date(e.end),
    who: e.who || "", kind: e.kind || "family"
  }));
}

// ----- Familiekalender (kun familiens egne aftaler) -----
function renderCalendar(events) {
  if (events) lastEvents = events;
  const list = $("calList"); list.innerHTML = "";
  const now = new Date(), today = startOfDay(now);
  const evs = parseEvents().filter(e => e.kind !== "school");

  for (let i = 0; i < CONFIG.calendarDays; i++) {
    const ds = addDays(today, i), de = addDays(today, i + 1);
    const todays = evs.filter(e => e.start < de && e.end > ds);
    if (!todays.length && i > 0) continue;

    const box = el("div", "day" + (i === 0 ? " today" : ""));
    box.appendChild(el("h3", null, dayLabel(ds, i)));
    if (!todays.length) box.appendChild(el("div", "empty", "Intet i kalenderen"));
    for (const e of todays) {
      const row = el("div", "ev" + (!e.allDay && e.end < now ? " past" : ""));
      row.appendChild(el("time", null, e.allDay ? "Hele dagen" : e.start < ds ? "Fortsat" : hhmm(e.start)));
      row.appendChild(el("div", "t", e.title));
      box.appendChild(row);
    }
    list.appendChild(box);
  }
  renderSchool();
}

// ----- Skema fra Aula -----
// En skematime er en tidsbestemt Aula-begivenhed, der starter før kl. 17.
const isLesson = e => e.kind === "school" && !e.allDay && e.start.getHours() < 17;
let schoolDay = null; // valgt dag (0 = i dag), null = automatisk

function renderSchool() {
  const box = $("kids"), seg = $("schoolDays");
  box.innerHTML = ""; seg.innerHTML = "";
  const now = new Date(), today = startOfDay(now);
  const evs = parseEvents().filter(e => e.kind === "school");
  const kids = [...new Set(evs.map(e => e.who))].sort();
  kids.forEach(colorFor);

  if (!getCalUrl()) { box.appendChild(el("div", "empty", "Forbind kalenderen for at se skemaet.")); return; }
  if (!kids.length) { box.appendChild(el("div", "empty", "Intet skema de næste dage.")); return; }

  // Dage med skole i den hentede periode
  const days = [];
  for (let i = 0; i < CONFIG.calendarDays; i++) {
    const ds = addDays(today, i), de = addDays(today, i + 1);
    const lessons = evs.filter(e => isLesson(e) && e.start < de && e.end > ds);
    if (lessons.length) days.push({ i, ds, de, done: lessons.every(l => l.end < now) });
  }
  if (!days.length) { box.appendChild(el("div", "empty", "Ingen skoledage de næste dage.")); return; }

  // Automatisk: i dag, indtil skoledagen er slut. Derefter næste skoledag.
  const auto = (days.find(d => !(d.i === 0 && d.done)) || days[0]).i;
  const sel = days.find(d => d.i === schoolDay) ? schoolDay : auto;

  days.slice(0, 5).forEach(d => {
    const label = d.i === 0 ? "I dag" : d.i === 1 ? "I morgen" : cap(DAYS[d.ds.getDay()]);
    const b = el("button", d.i === sel ? "on" : "", label); b.type = "button";
    b.onclick = () => { schoolDay = d.i; renderSchool(); };
    seg.appendChild(b);
  });

  const day = days.find(d => d.i === sel);
  box.style.gridTemplateColumns = "repeat(" + kids.length + ", 1fr)";
  kids.forEach(who => {
    const mine = evs.filter(e => e.who === who && e.start < day.de && e.end > day.ds);
    const lessons = mine.filter(isLesson).sort((a, b) => a.start - b.start);
    const extras = mine.filter(e => !isLesson(e));

    const card = el("div", "kid");
    const head = el("div", "kidhead");
    head.appendChild(dot(who));
    head.appendChild(el("b", null, who));
    if (lessons.length) {
      const last = new Date(Math.max(...lessons.map(l => l.end)));
      head.appendChild(el("span", "span", hhmm(lessons[0].start) + "–" + hhmm(last)));
    }
    card.appendChild(head);

    if (!lessons.length) card.appendChild(el("div", "empty", "Fri"));
    lessons.forEach(l => {
      const cancelled = /aflys/i.test(l.title), changed = /ændr|vikar/i.test(l.title);
      const r = el("div", "lesson" + (l.end < now ? " past" : "") + (cancelled ? " cancelled" : "") + (changed ? " changed" : ""));
      r.appendChild(el("time", null, hhmm(l.start)));
      r.appendChild(el("div", "t", l.title));
      card.appendChild(r);
    });
    extras.forEach(e => {
      const r = el("div", "extra");
      r.appendChild(el("time", null, e.allDay ? "Hele dagen" : hhmm(e.start)));
      r.appendChild(el("div", "t", e.title));
      card.appendChild(r);
    });
    box.appendChild(card);
  });
}

// ----- SFO-aktiviteter (indtastet i CONFIG.sfo) -----
function renderSFO() {
  const S = CONFIG.sfo, grid = $("sfoWeek");
  grid.innerHTML = "";
  const now = new Date();
  let todayIdx = now.getDay(); // 0 = søndag
  if (todayIdx === 0 || todayIdx === 6) todayIdx = 1; // weekend: fremhæv mandag

  const note = $("sfoNote");
  if (S.opdaterSenest && isoDate(now) > S.opdaterSenest) {
    note.textContent = "Tid til at opdatere aktiviteterne"; note.className = "err";
  } else { note.textContent = S.periode || ""; note.className = ""; }

  for (let d = 1; d <= 5; d++) {
    const col = el("div", "sfoday" + (d === todayIdx ? " today" : ""));
    col.appendChild(el("h3", null, cap(DAYS[d])));
    const items = S.dage[d] || [];
    if (!items.length) col.appendChild(el("div", "empty", "Ingen aktiviteter"));
    items.forEach(a => {
      const r = el("div", "act");
      r.appendChild(el("span", "ico", a.ikon || "•"));
      const txt = el("div", "txt");
      txt.appendChild(el("div", "n", a.navn));
      txt.appendChild(el("div", "tm", a.tid));
      r.appendChild(txt);
      col.appendChild(r);
    });
    grid.appendChild(col);
  }
}

// ---------- Opdatering ----------
const loaders = {
  weather: () => run("weatherStatus", loadWeather),
  prices: () => run("priceStatus", loadPrices),
  calendar: () => run("calStatus", loadCalendar)
};
function refreshAll() { loaders.weather(); loaders.prices(); loaders.calendar(); }

// Tryk på et panel for at opdatere det med det samme
$("week").onclick = loaders.weather;
$("price").querySelector("h2").onclick = loaders.prices;
// Tegn grafen igen, når iPad'en vendes eller vinduet ændrer størrelse
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderPrices, 150); });
$("calStatus").onclick = e => {
  e.stopPropagation();
  if ($("calStatus").classList.contains("err")) showSetup(); else loaders.calendar();
};
$("cal").querySelector("h2").onclick = loaders.calendar;

$("setupSave").onclick = () => {
  const u = $("setupInput").value.trim();
  if (!/^https:\/\/script\.google\.com\/.+key=/.test(u)) {
    $("setupInput").focus();
    $("setupInput").placeholder = "Adressen skal starte med https://script.google.com og indeholde key=";
    $("setupInput").value = "";
    return;
  }
  setCalUrl(u); hideSetup(); loaders.calendar();
};
$("setupSkip").onclick = () => { hideSetup(); renderCalNotConnected(); };

// Når iPad'en vågner eller appen kommer frem igen
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (Date.now() - hiddenAt > 5 * 60 * 1000) refreshAll();
});

// Genindlæs siden lige efter midnat, så "i dag" altid passer
(function scheduleMidnight() {
  const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 1, 0);
  setTimeout(() => location.reload(), next - n);
})();

tick(); setInterval(tick, 10000);
renderSFO();
refreshAll();
setInterval(loaders.weather, CONFIG.refreshMinutes.weather * 60000);
setInterval(loaders.prices, CONFIG.refreshMinutes.prices * 60000);
setInterval(loaders.calendar, CONFIG.refreshMinutes.calendar * 60000);
if (!getCalUrl()) showSetup();
